# Local PostgreSQL for development and tests: `docker compose up -d`
services:
  postgres:
    image: postgres:16-alpine
    container_name: bloodconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloodconnect
      POSTGRES_PASSWORD: bloodconnect
      POSTGRES_DB: bloodconnect
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodconnect -d bloodconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
