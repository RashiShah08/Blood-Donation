name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql://bloodconnect:bloodconnect@localhost:5432/bloodconnect_test

jobs:
  test:
    name: Lint, unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bloodconnect
          POSTGRES_PASSWORD: bloodconnect
          POSTGRES_DB: bloodconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bloodconnect" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -m "not e2e"

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bloodconnect
          POSTGRES_PASSWORD: bloodconnect
          POSTGRES_DB: bloodconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bloodconnect" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e
