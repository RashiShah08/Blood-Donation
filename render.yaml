# Render Blueprint: one free web service that serves the whole app (pages and API).
# The database is Neon's free PostgreSQL (Render's free database is deleted after 30 days).
# Values marked `sync: false` are secrets you paste into the Render dashboard; never commit them.
services:
  - type: web
    name: bloodconnect
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    # One worker keeps memory inside the free 512 MB and keeps in-memory rate limits exact;
    # threads handle concurrent requests.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    # Python version comes from .python-version (3.12, the version CI tests against).
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # Render sits in front of the app as one reverse proxy.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      # Anyone can sign up as a hospital, so only verified hospitals may email donors.
      # Verify one from your computer: flask --app app verify-hospital EMAIL (with DATABASE_URL set to Neon).
      - key: REQUIRE_HOSPITAL_VERIFICATION
        value: "1"
      # Neon connection string, for example postgresql://user:pass@ep-xxx.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # The site's public address, used in email links, for example https://bloodconnect.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      # Email alerts through Brevo's HTTPS API (Render's free tier blocks SMTP ports).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: BloodConnect
      # Optional: road directions. Without it, directions use a straight line.
      - key: ORS_API_KEY
        sync: false
