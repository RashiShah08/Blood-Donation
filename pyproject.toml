[project]
name = "bloodconnect"
version = "2.0.0"
description = "Connects hospitals that need blood with nearby, compatible, voluntary donors."
requires-python = ">=3.11"
# Kept identical to requirements.txt (tests/test_packaging.py checks it). Vercel installs from here.
dependencies = [
    "Flask==3.1.3",
    "Flask-Limiter==3.12",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-WTF==1.2.2",
    "gunicorn==26.2.0",
    "pg8000==1.31.5",
    "python-dotenv==1.2.3",
    "SQLAlchemy==2.0.52",
]

# An application, not a library: installers must not try to build it as a package.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: browser tests that drive the real UI with Playwright (need `playwright install chromium`)",
]
filterwarnings = ["ignore::DeprecationWarning:flask_limiter.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["bloodconnect/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test passwords
"bloodconnect/cli.py" = ["S105"]  # published demo password
